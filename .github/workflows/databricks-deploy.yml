name: Deploy to Databricks

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Databricks CLI v2
      run: |
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | bash

    - name: Configure CLI
      run: |
        echo "[DEFAULT]" >> ~/.databrickscfg
        echo "host = ${{ secrets.DATABRICKS_HOST }}" >> ~/.databrickscfg
        echo "token = ${{ secrets.DATABRICKS_TOKEN }}" >> ~/.databrickscfg

    - name: Test Connection
      run: databricks workspace list /

    - name: Deploy notebooks
      run: databricks workspace import-dir databricks /Shared/gasstations-ci --overwrite